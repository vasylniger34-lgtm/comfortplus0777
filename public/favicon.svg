<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#facc15" stroke-width="2.5"/>

  <!-- Minibus Silhouette -->
  <g transform="translate(4, 8)">
    <!-- Main Body -->
    <path d="M 6 12 C 6 9.2 8.2 7 11 7 L 38 7 C 40.2 7 42.3 8 43.7 9.7 L 51.5 19.3 C 51.8 19.7 52 20.3 52 20.8 L 52 33 C 52 35.8 49.8 38 47 38 L 9 38 C 6.2 38 4 35.8 4 33 L 4 14 C 4 12.9 4.9 12 6 12 Z" fill="url(#yellowGrad)" filter="url(#glow)"/>
    
    <!-- Dark Windows -->
    <path d="M 10 12 L 18 12 L 18 22 L 10 22 Z" fill="#0f172a" rx="1" opacity="0.85"/>
    <path d="M 21 12 L 34 12 L 34 22 L 21 22 Z" fill="#0f172a" rx="1" opacity="0.85"/>
    <path d="M 37 12 L 41.5 12 C 42.7 12 43.8 12.5 44.5 13.4 L 48.6 18.6 C 48.9 19 49 19.5 49 20 L 49 22 L 37 22 Z" fill="#0f172a" opacity="0.85"/>
    
    <!-- Headlight & Front Grille detail -->
    <path d="M 49.5 26 L 52 26 L 52 29 L 49.5 29 Z" fill="#ffffff" rx="1"/>
    
    <!-- Wheels -->
    <!-- Rear Wheel -->
    <circle cx="15" cy="38" r="6" fill="#090d16" stroke="#facc15" stroke-width="2"/>
    <circle cx="15" cy="38" r="2.5" fill="#facc15"/>
    
    <!-- Front Wheel -->
    <circle cx="41" cy="38" r="6" fill="#090d16" stroke="#facc15" stroke-width="2"/>
    <circle cx="41" cy="38" r="2.5" fill="#facc15"/>
  </g>
</svg>